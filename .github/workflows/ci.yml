name: CI

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

# Permiso minimo: el job solo lee el codigo.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build with fixtures
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm

      - name: Install
        run: npm ci

      - name: Audit dependencies
        run: npm audit --audit-level=high

      - name: Type check
        run: npx astro check

      # Los PRs de Dependabot y los forks no reciben secretos: se compila con
      # fixtures para validar el build sin credenciales de Google.
      - name: Build
        run: npm run build
        env:
          USE_FIXTURES: '1'
