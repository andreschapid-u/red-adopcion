version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '06:00'
      timezone: America/Bogota
    open-pull-requests-limit: 5
    groups:
      astro:
        patterns:
          - astro
          - '@astrojs/*'
      tailwind:
        patterns:
          - tailwindcss
          - '@tailwindcss/*'
      fonts:
        patterns:
          - '@fontsource-variable/*'
      development:
        dependency-type: development
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '06:15'
      timezone: America/Bogota
    open-pull-requests-limit: 5
    groups:
      actions:
        patterns:
          - '*'
