version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '06:00'
      timezone: America/Bogota
    open-pull-requests-limit: 5
    # @astrojs/check solo acepta typescript ^5 || ^6. Revisar cuando lo amplie.
    ignore:
      - dependency-name: typescript
        update-types:
          - version-update:semver-major
    groups:
      astro:
        patterns:
          - astro
          - '@astrojs/*'
      tailwind:
        patterns:
          - tailwindcss
          - '@tailwindcss/*'
      fonts:
        patterns:
          - '@fontsource-variable/*'
      development:
        dependency-type: development
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '06:15'
      timezone: America/Bogota
    open-pull-requests-limit: 5
    groups:
      actions:
        patterns:
          - '*'
